# CPT stage 2b: second half of template pairs, two new edit operations, replay
name: 03_cpt_mix_b
output_dir: experiments/03_cpt_mix_b
seed: 2233
base_model: black-forest-labs/FLUX.2-klein-base-9B
init_from: experiments/02_cpt_mix_a/checkpoint-8500/pytorch_model_fsdp.bin
# Qwen3 features: 1 = outputs of decoder layers 9/18/27 (all paper runs), 0 = hidden_states[9, 18, 27]
text_layer_offset: 1

data:
  config: configs/data/cpt_mix_b.yaml
  root: ${oc.env:INFOVIS_DATA_ROOT,data/InfoVis-Data}
  max_tokens: 4096
  max_output_pixels: 1048576
  max_input_pixels: [1048576, 1048576, 1048576, 1048576]
  max_input_images: 4
  max_side_length: 2048
  prompt_dropout_prob: 0.0001
  ref_img_dropout_prob: 0.5
  num_workers: 12

train:
  global_batch_size: 640        # 10 nodes x 8 GPUs x batch_size x gradient_accumulation_steps
  batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 6000
  learning_rate: 5.0e-5
  warmup_steps: 20
  warmup_lr_init: 1.0e-7
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  adam_eps: 1.0e-8
  max_grad_norm: 1.0
  gradient_checkpointing: true
  checkpointing_steps: 250
  checkpoints_total_limit: null
  log_every: 10
